name: strawhat-desk daily
on:
  schedule:
    # Off the top of the hour (GitHub drops/delays :00 jobs). Primary = first slot at/after 9am CT; the rest are backups.
    - cron: "7 14 * * *"    # 9:07am CDT / 8:07am CST (CST: guard skips, too early)
    - cron: "7 15 * * *"    # 10:07am CDT / 9:07am CST
    - cron: "37 15 * * *"   # backup: 10:37am CDT / 9:37am CST
    - cron: "37 16 * * *"   # backup: 11:37am CDT / 10:37am CST
    # Pre-kick RECHECK, Sat (CFB) + Sun (NFL), ~11:30am CT: guard runs only the slots that land in the 11am CT hour.
    - cron: "27 16 * * 0,6"   # 11:27am CDT
    - cron: "27 17 * * 0,6"   # 11:27am CST
    - cron: "47 16 * * 0,6"   # backup 11:47am CDT
    - cron: "47 17 * * 0,6"   # backup 11:47am CST / 12:47pm CDT (late-fire safety; window 11am-2pm CT)
    - cron: "17 18 * * 0,6"   # backup 1:17pm CDT / 12:17pm CST
  workflow_dispatch:
    inputs:
      mode:
        description: "daily (full 9am run) or recheck (pre-kick recheck)"
        default: daily
        type: choice
        options: [daily, recheck]
permissions:
  contents: write
concurrency:
  group: strawhat-desk
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: once-per-CT-day guard (DST-safe)
        id: guard
        # mode: recheck crons are the "27/47 * * 0,6" entries; dispatch takes inputs.mode.
        # daily (scheduled): CT hour 9-11 and no scheduled daily run yet today (data/last_scheduled_run_ct.txt).
        # recheck (scheduled): CT hour 11, today's daily run done, no recheck yet today (data/last_recheck_ct.txt).
        # Manual runs always go. Credits are capped in desk/toa.py (40/day); the 9am run reserves 6/sport for the recheck.
        run: |
          H=$(TZ=America/Chicago date +%-H); D=$(TZ=America/Chicago date +%F)
          BR="${{ github.event.repository.default_branch }}"
          git fetch -q origin "$BR"
          rd() { git show "origin/$BR:data/$1" 2>/dev/null | tr -d '[:space:]' || true; }
          LAST=$(rd last_scheduled_run_ct.txt); LASTR=$(rd last_recheck_ct.txt)
          SCHED="${{ github.event.schedule }}"
          MODE=daily
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; [ -z "$MODE" ] && MODE=daily; fi
          case "$SCHED" in *"* * 0,6") MODE=recheck;; esac
          GO=yes
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$MODE" = "daily" ]; then
              if [ "$H" -lt 9 ] || [ "$H" -gt 11 ]; then GO=no; echo "skip: CT hour $H outside 9-11"; fi
              if [ "$LAST" = "$D" ]; then GO=no; echo "skip: scheduled daily run already done for $D"; fi
            else
              if [ "$H" -lt 11 ] || [ "$H" -gt 14 ]; then GO=no; echo "skip: recheck slot outside 11am-2pm CT ($H)"; fi
              if [ "$LAST" != "$D" ]; then GO=no; echo "skip: no daily run yet today ($LAST)"; fi
              if [ "$LASTR" = "$D" ]; then GO=no; echo "skip: recheck already done for $D"; fi
            fi
          fi
          echo "event=${{ github.event_name }} sched='$SCHED' mode=$MODE ct=$D h=$H last=$LAST lastr=$LASTR go=$GO"
          echo "go=$GO" >> $GITHUB_OUTPUT; echo "mode=$MODE" >> $GITHUB_OUTPUT
      - name: sync to latest main
        if: steps.guard.outputs.go == 'yes'
        run: git checkout -q -B "${{ github.event.repository.default_branch }}" "origin/${{ github.event.repository.default_branch }}"
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'yes'
        with: { python-version: "3.12" }
      - name: deps + nflverse weekly player stats (free)
        if: steps.guard.outputs.go == 'yes'
        run: |
          pip install -q numpy pandas
          mkdir -p data/cache
          for y in 2024 2025 2026; do curl -sfL -o data/cache/stats_player_week_$y.csv "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_$y.csv"; done
          curl -sfL -o data/history/nfl_games.csv https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv || true
      - name: run desk (LINES -> BOARD -> PROPS -> TEASERS -> GRADER -> PUBLISH)
        if: steps.guard.outputs.go == 'yes'
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          SH_DAILY_CAP: "40"
        run: |
          if [ "${{ steps.guard.outputs.mode }}" = "recheck" ]; then python -m desk.recheck; else python -m desk.run; fi
      - name: commit
        if: steps.guard.outputs.go == 'yes'
        run: |
          git config user.name "strawhat-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ steps.guard.outputs.mode }}" = "recheck" ]; then TZ=America/Chicago date +%F > data/last_recheck_ct.txt; else TZ=America/Chicago date +%F > data/last_scheduled_run_ct.txt; fi
          fi
          git add -A data docs
          git commit -m "${{ steps.guard.outputs.mode }} desk $(TZ=America/Chicago date '+%Y-%m-%d %H:%M CT')" || echo "nothing to commit"
          git pull --rebase -q || true
          git push
