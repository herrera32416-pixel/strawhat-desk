name: strawhat-desk daily
on:
  schedule:
    # Off the top of the hour (GitHub drops/delays :00 jobs). Primary = first slot at/after 9am CT; the rest are backups.
    - cron: "7 14 * * *"    # 9:07am CDT / 8:07am CST (CST: guard skips, too early)
    - cron: "7 15 * * *"    # 10:07am CDT / 9:07am CST
    - cron: "37 15 * * *"   # backup: 10:37am CDT / 9:37am CST
    - cron: "37 16 * * *"   # backup: 11:37am CDT / 10:37am CST
    # Catch dropped 9-11am slots (GitHub sometimes fires none of them; Oct 5 2026 missed all four).
    - cron: "7 17 * * *"    # noon catch: 12:07pm CDT / 11:07am CST
    - cron: "37 17 * * *"   # noon catch: 12:37pm CDT / 11:37am CST
    # Oct 6 2026: noon catches fired, but GitHub delivered them at 2:29-3:31pm CT and the hour>12 guard skipped them.
    # Stamp stayed yesterday. These afternoon slots cover a late delivery; guard still no-ops if today is already stamped.
    - cron: "7 19 * * *"    # 2:07pm CDT / 1:07pm CST
    - cron: "7 20 * * *"    # 3:07pm CDT / 2:07pm CST
    # Pre-kick RECHECK (kickoff-driven, since 2026-10-04). Every recheck cron starts with "15,45"; each slot runs the
    # stdlib planner (desk/recheck_plan.py, no credits) and only continues if an OPEN item kicks within 70 min and has
    # not been rechecked yet. Sunday NFL: ~11:15am CT (noon), ~2:15pm (3:05/3:25), ~6:15pm (7:20), each + :45 backup.
    - cron: "15,45 15-22 * * 0,6"  # Sat/Sun daytime: 10:15am-5:45pm CDT / 9:15am-4:45pm CST
    - cron: "15,45 12-14 * * 0"    # Sun morning (international ~8:30am CT kicks): 7:15-9:45am CDT
    - cron: "15,45 23 * * *"       # evenings (SNF/MNF/TNF, late CFB): 6:15/6:45pm CDT, 5:15/5:45pm CST
    - cron: "15,45 0-3 * * *"      # evenings: 7:15-10:45pm CDT / 6:15-9:45pm CST
  workflow_dispatch:
    inputs:
      mode:
        description: "daily (full 9am run) or recheck (pre-kick recheck; no-op unless something open kicks within 70 min)"
        default: daily
        type: choice
        options: [daily, recheck]
permissions:
  contents: write
concurrency:
  group: strawhat-desk
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: sync to latest main
        run: |
          git fetch -q origin "${{ github.event.repository.default_branch }}"
          git checkout -q -B "${{ github.event.repository.default_branch }}" "origin/${{ github.event.repository.default_branch }}"
      - name: guard (daily once per CT day; recheck only when something open kicks within 70 min)
        id: guard
        # mode: recheck crons are the "15,45 ..." entries; dispatch takes inputs.mode.
        # daily (scheduled): CT hour 9-18 and no scheduled daily run yet today (data/last_scheduled_run_ct.txt).
        # Window is wide on purpose: GitHub often delivers a 12:07 cron at 2-3pm. A late delivery must still publish
        # if today's stamp is missing. Before 9am CT stays a skip so an overnight delayed job does not stamp the next day.
        # recheck (scheduled or manual): python3 -m desk.recheck_plan (stdlib, no credits) must say go=yes, i.e. an open
        # official item / prop kicks within 70 min and was not rechecked yet (data/recheck_done.json).
        # Credits are capped in desk/toa.py (40/day); the 9am run reserves 4 per recheck window of today's official items.
        run: |
          H=$(TZ=America/Chicago date +%-H); D=$(TZ=America/Chicago date +%F)
          BR="${{ github.event.repository.default_branch }}"
          git fetch -q origin "$BR"
          rd() { git show "origin/$BR:data/$1" 2>/dev/null | tr -d '[:space:]' || true; }
          LAST=$(rd last_scheduled_run_ct.txt); LASTR=$(rd last_recheck_ct.txt)
          SCHED="${{ github.event.schedule }}"
          MODE=daily
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; [ -z "$MODE" ] && MODE=daily; fi
          case "$SCHED" in "15,45 "*) MODE=recheck;; esac
          GO=yes
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$MODE" = "daily" ]; then
              if [ "$H" -lt 9 ] || [ "$H" -gt 18 ]; then GO=no; echo "skip: CT hour $H outside 9-18"; fi
              if [ "$LAST" = "$D" ]; then GO=no; echo "skip: scheduled daily run already done for $D"; fi
            fi
          fi
          if [ "$MODE" = "recheck" ]; then
            P=$(python3 -m desk.recheck_plan 2>&1 || echo "go=no planner error")
            echo "planner: $P"
            case "$P" in *"go=yes"*) ;; *) GO=no;; esac
          fi
          echo "event=${{ github.event_name }} sched='$SCHED' mode=$MODE ct=$D h=$H last=$LAST lastr=$LASTR go=$GO"
          echo "go=$GO" >> $GITHUB_OUTPUT; echo "mode=$MODE" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'yes'
        with: { python-version: "3.12" }
      - name: deps + nflverse weekly player stats (free)
        if: steps.guard.outputs.go == 'yes'
        run: |
          pip install -q numpy pandas
          if [ "${{ steps.guard.outputs.mode }}" = "recheck" ]; then exit 0; fi
          pip install -q pyarrow   # MATCHUP: current-season nflverse play-by-play (parquet)
          mkdir -p data/cache
          for y in 2024 2025 2026; do curl -sfL -o data/cache/stats_player_week_$y.csv "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_$y.csv"; done
          curl -sfL -o data/history/nfl_games.csv https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv || true
      - name: run desk (LINES -> BOARD -> PROPS -> GRADER -> MATCHUP -> SIM -> PUBLISH)
        if: steps.guard.outputs.go == 'yes'
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          SH_DAILY_CAP: "10"
        run: |
          if [ "${{ steps.guard.outputs.mode }}" = "recheck" ]; then python -m desk.recheck; else python -m desk.run; fi
      - name: commit
        if: steps.guard.outputs.go == 'yes'
        run: |
          git config user.name "strawhat-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ steps.guard.outputs.mode }}" = "recheck" ]; then TZ=America/Chicago date +%F > data/last_recheck_ct.txt; else TZ=America/Chicago date +%F > data/last_scheduled_run_ct.txt; fi
          fi
          git add -A data docs
          git commit -m "${{ steps.guard.outputs.mode }} desk $(TZ=America/Chicago date '+%Y-%m-%d %H:%M CT')" || echo "nothing to commit"
          git pull --rebase -q || true
          git push
